name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          echo "Checking RaceDay repository..."
          test -d docs
          test -f README.md
          echo "RaceDay repository structure is valid."
